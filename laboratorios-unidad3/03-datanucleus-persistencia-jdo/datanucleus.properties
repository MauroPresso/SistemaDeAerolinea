# Implementacion JDO provista por DataNucleus.
javax.jdo.PersistenceManagerFactoryClass=org.datanucleus.api.jdo.JDOPersistenceManagerFactory

# Conexion a H2.
javax.jdo.option.ConnectionDriverName=org.h2.Driver
javax.jdo.option.ConnectionURL=jdbc:h2:file:./data/aerolinea_orm
javax.jdo.option.ConnectionUserName=sa
javax.jdo.option.ConnectionPassword=

# El schema se crea explicitamente con SchemaTool.
datanucleus.schema.autoCreateAll=false
datanucleus.schema.validateAll=false
